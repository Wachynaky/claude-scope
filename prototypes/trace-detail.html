<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace detail · prototipo</title>
<style>
/* ── Tema (copiado de app/index.html:20-61) ───────────────────────────── */
:root {
    --accent: #e82a6b; --accent-strong: #ff3d80; --accent-soft: rgba(232,42,107,.10);
    --accent-line: rgba(232,42,107,.45); --accent-dim: #c4185b;
    --bg: #ffffff; --text: #1b1b1e; --text-soft: #3d3d44; --text-dim: #74747d; --muted: #74747d;
    --surface: #ffffff; --surface-2: #fafafa; --surface-sunk: #f3f3f5;
    --line: rgba(0,0,0,.10); --line-strong: rgba(0,0,0,.16); --line2: rgba(0,0,0,.06);
    /* categorías de token/coste */
    --c-input: #f59e0b; --c-output: #059669; --c-cread: #6366f1; --c-cwrite: #ec4899;
    --radius: 14px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --chat-right: 360px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--surface-sunk); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body.resizing { cursor: col-resize; user-select: none; }
.page { max-width: none; margin: 0; padding: 12px 18px 14px; }
.proto-note { font-size: 12px; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.proto-note .pill { background: var(--accent-soft); color: var(--accent-dim); border: 1px solid var(--accent-line); border-radius: 999px; padding: 2px 9px; font-weight: 600; }

.trace-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 18px 50px -28px rgba(20,19,26,.35); overflow: hidden; position: relative; display: flex; flex-direction: column; height: calc(100vh - 84px); }
#view-root { flex: 1 1 auto; min-height: 0; overflow: auto; }
.trace-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--accent-strong), var(--accent) 55%, var(--accent-dim)); z-index: 2; }

/* ── Cabecera ──────────────────────────────────────────────────────────── */
.trace-head { padding: 13px 20px 0; flex: none; }
.crumbs { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.crumbs b { color: var(--text); font-weight: 600; } .crumbs .sep { opacity: .4; }
.trace-prompt { font-size: 13.5px; color: var(--text); line-height: 1.4; margin: 0 0 8px; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; }
.chip .k { color: var(--muted); } .chip .v { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.chip.accent { border-color: var(--accent-line); background: var(--accent-soft); } .chip.accent .v { color: var(--accent-dim); }

.head-bd { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface-2); margin-bottom: 10px; }
.head-bd .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }

/* desglose tokens/coste */
.bd-bar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: var(--line); }
.bd-bar.lg { height: 12px; border-radius: 6px; }
.bd-bar > i { display: block; height: 100%; }
.bd-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 9px; }
.bd-legend .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.bd-legend .lg b { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.bd-legend .lg.total { margin-left: auto; font-weight: 700; color: var(--accent-dim); }
.bd-rows { margin-top: 12px; display: flex; flex-direction: column; }
.bd-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.bd-row:first-child { border-top: none; }
.bd-name { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
.bd-name b { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.bd-tok { font-size: 12.5px; color: var(--muted); min-width: 90px; text-align: right; }
.bd-cost { font-size: 13px; font-weight: 600; min-width: 78px; text-align: right; }
.bd-row.total { border-top: 1.5px solid var(--line-strong); margin-top: 2px; }
.bd-row.total .bd-name { font-weight: 700; } .bd-row.total .bd-cost { color: var(--accent-dim); }

/* mgrid (métricas del trace) — tarjetas limpias */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 8px; margin-bottom: 10px; }
.metric { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; min-width: 0; }
.metric .mk { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
.metric .mv { font-size: 14px; font-weight: 600; color: var(--text); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric.accent .mv { color: var(--accent-dim); } .metric.dim .mv { color: var(--muted); }
.metric.think .mk { color: #7c3aed; } .metric.think .mv { color: #6d28d9; }
.mtools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.mtools-lbl { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 4px; }
.tool-chip { background: var(--accent-soft); color: var(--accent-dim); border: 1px solid var(--accent-line); border-radius: 999px; padding: 3px 11px; font-size: 11.5px; font-weight: 600; font-family: var(--mono); }
/* aviso de contenido ausente */
.ux-empty { background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.ux-empty b { color: var(--text-soft); }
/* diff en el visor */
.code-body .cl.del { background: rgba(248,81,73,.16); }
.code-body .cl.add { background: rgba(63,185,80,.16); }
.code-ln.diff span { color: #6e7681; font-weight: 700; }
/* clamp "Ver todo" */
.code-view.clampable .code-main { max-height: 250px; overflow: hidden; }
.code-view.clampable.expanded .code-main { max-height: 620px; overflow: auto; }
.cv-more { display: block; width: 100%; border: none; border-top: 1px solid #30363d; background: #161b22; color: #7d8590; font-size: 11.5px; padding: 7px; cursor: pointer; font-family: var(--mono); }
.cv-more:hover { color: #e6edf3; }
.msg-clamp .msg-body.clampable { max-height: 230px; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
.msg-clamp.expanded .msg-body.clampable { max-height: none; -webkit-mask-image: none; mask-image: none; }
.msg-clamp .cv-more.body { border: none; border-top: 1px solid var(--line); background: transparent; color: var(--accent-dim); font-family: var(--sans); font-weight: 600; }
.msg-clamp .cv-more.body:hover { color: var(--accent); }
details.trace-extra { margin-bottom: 16px; }
details.trace-extra > summary { cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); list-style: none; padding: 6px 0; display: flex; align-items: center; gap: 6px; }
details.trace-extra > summary::-webkit-details-marker { display: none; }
details.trace-extra > summary::before { content: "▶"; font-size: 9px; transition: transform .15s; }
details.trace-extra[open] > summary::before { transform: rotate(90deg); }

/* ── Tabs ──────────────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
.tab { appearance: none; background: none; border: none; padding: 11px 16px; font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent-dim); border-bottom-color: var(--accent); }
.tab .tcount { font-size: 11px; background: var(--surface-sunk); border-radius: 999px; padding: 1px 7px; color: var(--muted); font-weight: 700; }
.tab.active .tcount { background: var(--accent-soft); color: var(--accent-dim); }

/* ── Badges (app/index.html:1656-1676) ────────────────────────────────── */
.badge { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; text-transform: uppercase; flex: none; }
.badge.request { background: #fde68a; color: #854d0e; } .badge.generation { background: #bbf7d0; color: #065f46; }
.badge.thinking { background: #ddd6fe; color: #5b21b6; } .badge.tool { background: var(--accent-line); color: #fff; }
.badge.result { background: #99f6e4; color: #115e59; } .badge.system { background: #cbd5e1; color: #1e293b; }

/* ── Vista SPANS: árbol + detalle ──────────────────────────────────────── */
.trace-body { display: grid; grid-template-columns: minmax(360px, 40fr) 60fr; min-height: 560px; }
.tree-col { border-right: 1px solid var(--line); background: var(--surface-2); max-height: 760px; overflow: auto; }
.col-title { position: sticky; top: 0; z-index: 1; background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 11px 16px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.span-row { display: grid; grid-template-columns: 18px auto 1fr auto; align-items: center; gap: 8px; padding: 7px 14px 7px 0; padding-left: calc(12px + var(--indent,0) * 18px); cursor: pointer; border-left: 3px solid transparent; }
.span-row:hover { background: var(--surface-sunk); }
.span-row.selected { background: var(--accent-soft); border-left-color: var(--accent); }
.span-row .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .12s; flex: none; }
.span-row.open > .chev { transform: rotate(90deg); } .span-row .chev.hidden { visibility: hidden; }
.span-row.collapsed-hidden { display: none; }
.span-title { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.span-side { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.span-side .metric-s { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dur-bar { width: 64px; height: 4px; border-radius: 3px; background: var(--line); overflow: hidden; }
.dur-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-strong), var(--accent)); border-radius: 3px; }

.detail-col { background: var(--surface); } .detail-inner { padding: 0 0 22px; }
.detail-hd { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 16px 22px 14px; z-index: 1; }
.detail-hd .row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.detail-hd h2 { margin: 0; font-size: 16px; font-weight: 650; }
.detail-hd .clock { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.section { padding: 18px 22px 0; } .section h3 { margin: 0 0 9px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
.meta { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; }
.meta .mk { font-size: 11px; color: var(--muted); margin-bottom: 3px; } .meta .mv { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-style: italic; }

/* ── Visor de código ───────────────────────────────────────────────────── */
/* visor oscuro tipo terminal */
.code-view { border: 1px solid #30363d; border-radius: 10px; overflow: hidden; background: #0d1117; box-shadow: 0 8px 24px -16px rgba(0,0,0,.6); }
.code-view + .code-view { margin-top: 10px; }
.code-hd { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #161b22; border-bottom: 1px solid #30363d; }
.code-hd .dots { display: inline-flex; gap: 5px; } .code-hd .dots i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.code-hd .dots i:nth-child(1){background:#ff5f57} .code-hd .dots i:nth-child(2){background:#febc2e} .code-hd .dots i:nth-child(3){background:#28c840}
.code-hd .code-name { font-family: var(--mono); font-size: 12px; color: #e6edf3; font-weight: 600; }
.code-hd .code-lang { margin-left: auto; font-family: var(--mono); font-size: 11px; color: #7d8590; text-transform: lowercase; }
.code-main { display: grid; grid-template-columns: auto 1fr; max-height: 360px; overflow: auto; background: #0d1117; }
.code-ln { display: flex; flex-direction: column; text-align: right; padding: 11px 12px 11px 16px; background: #0d1117; border-right: 1px solid #21262d; user-select: none; position: sticky; left: 0; }
.code-ln span { font-family: var(--mono); font-size: 12.5px; line-height: 1.62; color: #6e7681; }
.code-body { margin: 0; padding: 11px 16px; }
.code-body .cl { display: block; font-family: var(--mono); font-size: 12.5px; line-height: 1.62; white-space: pre; color: #c9d1d9; }
/* tokens (paleta oscura tipo GitHub) */
.c-str{color:#a5d6ff} .c-num{color:#79c0ff} .c-com{color:#8b949e;font-style:italic}
.c-key{color:#7ee787} .c-bool{color:#ffa657} .c-flag{color:#ffa657} .c-kw{color:#ff7b72;font-weight:600}

/* ── Vista CONVERSACIÓN: chat-layout ───────────────────────────────────── */
.chat-layout { display: grid; grid-template-columns: minmax(0,1fr) 8px var(--chat-right); gap: 0; align-items: stretch; height: 100%; }
.chat-col { padding: 18px 20px 30px; min-width: 0; overflow-y: auto; }
.chat-resizer { cursor: col-resize; position: relative; align-self: stretch; }
.chat-resizer::before { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 2px; background: var(--line-strong); border-radius: 2px; transition: background .15s, width .15s; }
.chat-resizer:hover::before, body.resizing .chat-resizer::before { width: 3px; background: var(--accent-strong); }
.chat-resizer::after { content: ""; position: absolute; left: -3px; top: 80px; width: 14px; height: 54px; border: 1px solid var(--line-strong); border-radius: 8px; background: radial-gradient(circle, var(--muted) 1px, transparent 1.6px) 0 0/5px 5px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.chat-details { border-left: 1px solid var(--line); background: var(--surface); align-self: stretch; min-width: 0; overflow-y: auto; }

.chat-head-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
.chat-head-title { font-size: 15px; font-weight: 750; color: var(--text); margin-bottom: 12px; }
.chat-head-metrics { display: flex; flex-wrap: wrap; gap: 10px; }
.chat-metric { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px 5px 6px; font-size: 12.5px; color: var(--text-soft); }
.cm-ic { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; font-weight: 700; }
.chat-metric.cost .cm-ic { background: #fef3c7; color: #b45309; } .chat-metric.in .cm-ic { background: #fef3c7; color: #d97706; }
.chat-metric.out .cm-ic { background: #dcfce7; color: #15803d; } .chat-metric.dur .cm-ic { background: #ede9fe; color: #6d28d9; }
.chat-metric.tot .cm-ic { background: var(--accent-soft); color: var(--accent); }
.cm-lab { font-weight: 600; color: var(--text-dim); } .cm-val { font-weight: 750; color: var(--text); font-variant-numeric: tabular-nums; }
.turn-bulk { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
.turn-bulk .lab { font-size: 11px; color: var(--text-dim); font-weight: 700; }
.turn-bulk button, .mini-btn { font-size: 11px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text-soft); cursor: pointer; }
.turn-bulk button:hover, .mini-btn:hover { border-color: var(--accent-line); color: var(--accent); }

.msg-row { display: flex; gap: 10px; margin-bottom: 16px; align-items: flex-start; }
.msg-row.right { flex-direction: row-reverse; }
.msg-avatar { width: 34px; height: 34px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.10); }
.msg-avatar.you { background: #1f2937; color: #fff; } .msg-avatar.bot { background: linear-gradient(150deg, var(--accent-strong), var(--accent)); color: #fff; } .msg-avatar.sys { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
.msg-bubble { min-width: 0; max-width: 86%; border-radius: 14px; border: 1px solid var(--line); }
.msg-bubble.bot { background: var(--surface); } .msg-bubble.you { background: #fff3e0; border-color: #ffe0b2; } .msg-bubble.sys { background: var(--surface-2); }
.msg-head { display: flex; flex-direction: column; gap: 2px; padding: 9px 13px; border-bottom: 1px solid var(--line2); }
.msg-row.right .msg-head { align-items: flex-end; }
.msg-role { font-size: 12.5px; font-weight: 750; color: var(--text); } .msg-time { font-size: 11px; color: var(--text-dim); }
.msg-body { padding: 11px 13px; font-size: 13.5px; line-height: 1.55; color: var(--text); word-break: break-word; }
.msg-body p { margin: 0 0 8px; } .msg-body p:last-child { margin-bottom: 0; }
.msg-body ul, .msg-body ol { margin: 4px 0 8px; padding-left: 20px; }
.msg-body code { background: var(--surface-2); color: var(--accent-dim); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 12px; }
.msg-body strong { font-weight: 700; }

/* Thinking / tool plegables dentro de burbuja */
.chat-tool { margin: 10px 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.chat-tool.thinking { background: #faf5ff; border-color: #e9d5ff; }
.chat-tool > summary { cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-weight: 700; color: var(--text); list-style: none; user-select: none; }
.chat-tool > summary::-webkit-details-marker { display: none; }
.chat-tool > summary::before { content: "▶"; font-size: 10px; transition: transform .15s; color: var(--muted); }
.chat-tool[open] > summary::before { transform: rotate(90deg); }
.chat-tool .ct-name { font-family: var(--mono); font-weight: 750; } .chat-tool.thinking .ct-name { color: #6d28d9; }
.chat-tool .ct-count { margin-left: auto; font-size: 11px; color: var(--text-dim); font-weight: 600; }
.chat-tool-think { padding: 0 12px 12px; white-space: pre-wrap; color: #4c1d95; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }

/* ── Tool-step (Input/Output/Metadata) ─────────────────────────────────── */
.tool-step { padding: 0 12px 12px; }
.ts-invoke { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin: 2px 0 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; overflow: auto; }
.ts-invoke .ts-invoke-ic { color: #7d8590; flex: none; }
.ts-invoke code { font-family: var(--mono); font-size: 12px; color: #c9d1d9; white-space: nowrap; }
.ts-jumpbar { display: flex; gap: 8px; align-items: center; padding: 8px 0; font-size: 11px; }
.ts-jumpbar .lab { color: var(--text-dim); font-weight: 700; }
.ts-jumpbar a { text-decoration: none; border-bottom: 1px solid transparent; cursor: pointer; font-weight: 600; }
.ts-jumpbar a.in { color: var(--accent); } .ts-jumpbar a.out { color: #059669; } .ts-jumpbar a.meta { color: #64748b; }
.ts-jumpbar a:hover { border-bottom-color: currentColor; }
.ts-section { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 8px; }
.ts-section > summary { cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-weight: 700; list-style: none; user-select: none; }
.ts-section > summary::-webkit-details-marker { display: none; }
.ts-section > summary::before { content: "▾"; font-size: 11px; transition: transform .15s; }
.ts-section:not([open]) > summary::before { transform: rotate(-90deg); }
.ts-section.ts-input > summary { background: var(--accent-soft); color: var(--accent-dim); }
.ts-section.ts-output > summary { background: #ecfdf5; color: #047857; }
.ts-section.ts-meta > summary { background: #f8fafc; color: #475569; }
.ts-badge { margin-left: auto; font-size: 10px; font-weight: 600; opacity: .8; }
.ts-body { padding: 10px 12px; }
.ts-meta-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-family: var(--mono); font-size: 11.5px; }
.ts-meta-kv .k { color: #64748b; font-weight: 700; } .ts-meta-kv .v { color: #0f172a; word-break: break-all; }

/* ── Panel de detalles (chat-details) ──────────────────────────────────── */

.cd-nav { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }

.cd-summary-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.cd-chip { background: var(--surface-2); border: 1px solid var(--line); padding: 4px 10px; border-radius: 8px; font-size: 12px; }
.cd-chip .mono { font-family: var(--mono); color: var(--text-dim); }
.cd-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px,1fr)); gap: 7px; margin-bottom: 16px; }
.cd-metric { padding: 9px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; }
.cd-metric .cm-h { display: flex; align-items: center; gap: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); font-weight: 700; }
.cd-metric .cm-h .cm-ic { width: 16px; height: 16px; font-size: 9px; }
.cd-metric .cm-n { font-size: 16px; font-weight: 800; margin-top: 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cd-metric.cost .cm-ic { background: #fff3e0; color: #d97706; } .cd-metric.in .cm-ic { background: #fffbeb; color: #f59e0b; }

.cd-section-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; font-weight: 700; }

/* Gantt */

.gantt-row { display: grid; grid-template-columns: 130px 1fr 56px; gap: 10px; align-items: center; padding: 6px 12px; font-size: 12px; cursor: pointer; border-radius: 6px; }
.gantt-row:hover { background: var(--accent-soft); }

.g-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.gantt-track { height: 7px; background: var(--line); border-radius: 4px; position: relative; }
.gantt-bar { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 3px; }
.gantt-dur { font-size: 10.5px; color: var(--text-dim); font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
.gantt-axis { display: grid; grid-template-columns: 130px 1fr 56px; gap: 10px; padding: 6px 12px 0; border-top: 1px solid var(--line); margin-top: 4px; }

.tl-wrap { padding: 22px 24px 30px; }

function costOf(t) { const c = {}; let s = 0; for (const k in RATES) { c[k] = (t[k] || 0) / 1e6 * RATES[k]; s += c[k]; } c.total = s; return c; }

    let s = m ? m[1] : t.slice(0, 90);
    if (!s) return "Respuesta del asistente";
    return s.length < t.length && !/[.!?:]$/.test(s) ? s + "…" : s;
}

const KEYWORDS = {
    python: ["def","return","import","from","as","if","elif","else","for","while","in","not","and","or","class","with","try","except","assert","lambda","None","True","False","self","pass","raise","yield"],
    bash: ["grep","cd","ls","cat","echo","rm","cp","mv","mkdir","python3","git","sudo","export","for","do","done","if","then","fi","while","case","esac"],
    js: ["const","let","var","function","return","if","else","for","while","import","from","export","class","new","await","async","true","false","null","typeof","this"],
    sql: ["select","from","where","group","by","order","limit","join","on","as","and","or","count","sum","distinct","having"],
};
const CODE_LANGS = ["python","bash","sh","js","javascript","json","sql"];
function langKey(l) { return l === "sh" ? "bash" : l === "javascript" ? "js" : l; }

function hlLine(line, lang) {
    if (!line) return "&nbsp;";
    if (!CODE_LANGS.includes(lang)) return esc(line);    // texto plano: sin resaltar
    if (lang === "json") {                               // json: regex segura (opera sobre texto escapado)
        let s = esc(line);
        s = s.replace(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="c-key">$1</span>$2');
        s = s.replace(/(:\s*)(&quot;[^&]*?&quot;)/g, '$1<span class="c-str">$2</span>');
        s = s.replace(/\b(true|false|null)\b/g, '<span class="c-bool">$1</span>');
        s = s.replace(/(:\s*)(-?\d+\.?\d*)/g, '$1<span class="c-num">$2</span>');
        return s;
    }
    return hlCode(line, lang);                           // resto: tokenizador de una pasada
}
// Tokeniza una línea de código emitiendo spans directamente (sin re-escanear el marcado
// inyectado, que era la causa de que `class`/`span` se resaltaran y rompieran el HTML).
function hlCode(line, lang) {
    const kw = new Set(KEYWORDS[langKey(lang)] || []);
    const isW = c => /[A-Za-z0-9_]/.test(c);
    let out = "", i = 0, n = line.length;
    while (i < n) {
        const c = line[i];
        if (c === "#" || (c === "/" && line[i + 1] === "/")) { out += `<span class="c-com">${esc(line.slice(i))}</span>`; break; }
        if (c === '"' || c === "'") { let j = i + 1; while (j < n && line[j] !== c) j++; out += `<span class="c-str">${esc(line.slice(i, Math.min(j + 1, n)))}</span>`; i = j + 1; continue; }
        if (/[0-9]/.test(c)) { let j = i; while (j < n && /[0-9.eE]/.test(line[j])) j++; out += `<span class="c-num">${esc(line.slice(i, j))}</span>`; i = j; continue; }
        if (c === "-" && (i === 0 || line[i - 1] === " ") && /[A-Za-z-]/.test(line[i + 1] || "")) { let j = i; while (j < n && /[A-Za-z0-9-]/.test(line[j])) j++; out += `<span class="c-flag">${esc(line.slice(i, j))}</span>`; i = j; continue; }
        if (isW(c)) { let j = i; while (j < n && isW(line[j])) j++; const w = line.slice(i, j); out += kw.has(w) ? `<span class="c-kw">${esc(w)}</span>` : esc(w); i = j; continue; }
        out += esc(c); i++;
    }
    return out || "&nbsp;";
}
function codeView(block) {
    if (block.kind === "diff") return diffView(block);          // Edit: muestra reemplazo − antes / + después
    const known = CODE_LANGS.includes(block.lang);
    const lines = block.code.split("\n");
    const gutter = lines.map((_, i) => `<span>${i + 1}</span>`).join("");
    const body = lines.map(l => `<span class="cl">${hlLine(l, block.lang)}</span>`).join("");
    const tag = block.kind === "new" ? "nuevo archivo · " : "";
    const clamp = lines.length > 16;
    return `<div class="code-view${clamp ? " clampable" : ""}">
        <div class="code-hd"><span class="dots"><i></i><i></i><i></i></span>

        ${moreBtn(clamp, lines.length)}

}
// Botón "Ver todo / Ver menos" para contenido largo.
function moreBtn(clamp, n) {

// Vista de diff para Edit: bloque rojo (texto sustituido) seguido de bloque verde (texto nuevo).
function diffView(block) {
    const oldL = block.old.split("\n"), newL = block.new.split("\n");
    const rows = oldL.map(l => ({ m: "−", cls: "del", t: l })).concat(newL.map(l => ({ m: "+", cls: "add", t: l })));
    const gutter = rows.map(r => `<span>${r.m}</span>`).join("");
    const body = rows.map(r => `<span class="cl ${r.cls}">${hlLine(r.t, block.lang)}</span>`).join("");
    const clamp = rows.length > 16;
    return `<div class="code-view${clamp ? " clampable" : ""}">

            <span class="code-name">✎ ${esc(block.name)}</span>

        <div class="code-main"><div class="code-ln diff">${gutter}</div><div class="code-body">${body}</div></div>
        ${moreBtn(clamp, rows.length)}
    </div>`;
}

// ── Mini-markdown (sin librerías) ──────────────────────────────────────────
function mdInline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return s;
}
function renderProse(text) {
    const lines = text.split("\n"); let html = "", list = null, para = [];
    const flushP = () => { if (para.length) { html += `<p>${mdInline(para.join(" "))}</p>`; para = []; } };
    const flushL = () => { if (list) { html += `<${list.tag}>${list.items.join("")}</${list.tag}>`; list = null; } };
    for (const ln of lines) {
        const t = ln.trim(); let m;
        if (!t) { flushP(); flushL(); continue; }
        if ((m = t.match(/^[-*]\s+(.*)/))) { flushP(); if (!list || list.tag !== "ul") { flushL(); list = { tag: "ul", items: [] }; } list.items.push(`<li>${mdInline(m[1])}</li>`); }
        else if ((m = t.match(/^\d+\.\s+(.*)/))) { flushP(); if (!list || list.tag !== "ol") { flushL(); list = { tag: "ol", items: [] }; } list.items.push(`<li>${mdInline(m[1])}</li>`); }
        else { flushL(); para.push(t); }
    }
    flushP(); flushL(); return html;
}
function renderMd(text) {
    const parts = text.split(/```(\w*)\n([\s\S]*?)```/g);
    let html = "", i = 0;
    while (i < parts.length) {
        if (i % 3 === 0) { if (parts[i] && parts[i].trim()) html += renderProse(parts[i]); i++; }
        else { html += codeView({ lang: parts[i] || "text", name: parts[i] || "code", code: (parts[i + 1] || "").replace(/\n$/, "") }); i += 2; }
    }
    return html;
}

function breakdown(tokens, compact) {
    const cost = costOf(tokens), present = CATS.filter(c => (tokens[c.key] || 0) > 0), denom = cost.total || 1;
    const bar = present.map(c => `<i style="width:${(cost[c.key] / denom * 100).toFixed(2)}%;background:${c.color}" title="${c.label}"></i>`).join("");
    if (compact) {
        const lg = present.map(c => `<span class="lg"><b style="background:${c.color}"></b>${c.label} · ${fmtTok(tokens[c.key])}</span>`).join("");
        return `<div class="bd-bar">${bar}</div><div class="bd-legend">${lg}<span class="lg total">Σ ${fmtCost(cost.total)}</span></div>`;
    }
    const totTok = present.reduce((a, c) => a + (tokens[c.key] || 0), 0);
    const rows = present.map(c => `<div class="bd-row"><span class="bd-name"><b style="background:${c.color}"></b>${c.label}</span><span class="bd-tok">${fmtTok(tokens[c.key])} tok</span><span class="bd-cost">${fmtCost(cost[c.key])}</span></div>`).join("");
    return `<div class="bd-bar lg">${bar}</div><div class="bd-rows">${rows}<div class="bd-row total"><span class="bd-name">Total</span><span class="bd-tok">${fmtTok(totTok)} tok</span><span class="bd-cost">${fmtCost(cost.total)}</span></div></div>`;
}

                    <span class="chat-metric in"><span class="cm-ic">↓</span><span class="cm-lab">Input</span><span class="cm-val">${fmtTok(TOTALS.input + TOTALS.cacheRead)}</span></span>
                    <span class="chat-metric out"><span class="cm-ic">↑</span><span class="cm-lab">Output</span><span class="cm-val">${fmtTok(TOTALS.output)}</span></span>
                    <span class="chat-metric dur"><span class="cm-ic">◷</span><span class="cm-lab">Dur</span><span class="cm-val">${fmtMs(totalDur)}</span></span>
                </div>
            </div>
            <div class="ux-toolbar">
                <span class="seg"><button data-density="compact" class="${noneOpen ? "active" : ""}">▤ Spans</button><button data-density="expanded" class="${allOpen ? "active" : ""}">💬 Conversación</button></span>
                <span class="ux-hint">${noneOpen ? "Modo compacto — clic en una observación para expandirla" : allOpen ? "Modo conversación — todo expandido" : S.open.size + " de " + MOCK.nodes.length + " expandidos"}</span>
            </div>
            <div class="ux-list">${items}</div>
        </div>
        <div class="chat-resizer" id="chat-resizer"></div>
        <aside class="chat-details">${detailsPanel(S.selected)}</aside>
    </div>`;
}
// Envuelve el cuerpo de un mensaje, añadiendo clamp + botón "Ver todo" si es largo.
function msgBody(html, raw) {
    if ((raw || "").length <= 700) return `<div class="msg-body">${html}</div>`;
    return `<div class="msg-clamp"><div class="msg-body clampable">${html}</div><button class="cv-more body" data-more="⌄ Ver respuesta completa">⌄ Ver respuesta completa</button></div>`;
}
// Contenido "conversación" de una observación según su tipo.
function obsContent(n) {
    if (n.type === "request") return `<div class="msg-row"><div class="msg-avatar you">🧑</div><div class="msg-bubble you"><div class="msg-head"><span class="msg-role">You</span><span class="msg-time">Today ${n.clock}</span></div>${msgBody(renderProse(n.in.code), n.in.code)}</div></div>`;
    if (n.type === "generation") return `<div class="msg-row"><div class="msg-avatar bot">✦</div><div class="msg-bubble bot"><div class="msg-head"><span class="msg-role">Assistant</span><span class="msg-time">Today ${n.clock} · ${shortModel(MOCK.model)}</span></div>${msgBody(renderMd(n.out.code), n.out.code)}</div></div>`;
    if (n.type === "thinking") {
        const txt = (n.out.code || "").trim();
        const body = txt
            ? `<div class="ux-think-body">${esc(txt)}</div>`
            : `<div class="ux-empty">Sin texto de razonamiento: en sesiones con tools el <b>extended thinking</b> no se persiste en el transcript (solo se guarda la firma criptográfica del bloque), así que no hay contenido que mostrar.</div>`;
        return `<div class="ux-think"><div class="ux-think-h">💭 Thinking · ${fmtTok(n.tokens.output)} tok</div>${body}</div>`;
    }
    return toolStep(n); // tool: Input / Output / Metadata con visor de código
}

// ════════════════════════════════════════════════════════════════════════
//  Tool-step (Input / Output / Metadata)
// ════════════════════════════════════════════════════════════════════════
// Firma de la invocación de la tool (el "comando" real). Edit/Read/Write son llamadas
// estructuradas, no bash; Bash sí muestra el comando shell.
function invocationSig(n) {
    const t = n.tool || "Tool", b = n.in, cut = s => s.length > 96 ? s.slice(0, 96) + "…" : s;
    if (t === "Bash") return `Bash(command=${JSON.stringify(cut((b.code || "").split("\n")[0]))})`;
    if (t === "Edit" || t === "MultiEdit") return `Edit(file_path=${JSON.stringify(b.name)}, old_string=…, new_string=…)`;
    if (t === "Write") return `Write(file_path=${JSON.stringify(b.name)}, content=…)`;
    try { const o = JSON.parse(b.code); return `${t}(${Object.entries(o).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ")})`; }
    catch (e) { return `${t}(…)`; }
}
function toolStep(n) {
    const inKeys = n.in.lang === "json" ? (n.in.code.match(/&quot;/g) || n.in.code.match(/"/g) || []).length / 2 | 0 : null;
    const outLines = n.out.code.split("\n").length, outChars = n.out.code.length;
    const meta = Object.entries(n.extra || {}).map(([k, v]) => `<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`).join("");
    return `<div class="tool-step">
        <div class="ts-invoke"><span class="ts-invoke-ic">⌘</span><code>${esc(invocationSig(n))}</code></div>
        <div class="ts-jumpbar"><span class="lab">Jump to</span><a class="in">Input</a><a class="out">Output</a><a class="meta">Metadata</a></div>
        <details class="ts-section ts-input" open><summary>Input<span class="ts-badge">${inKeys != null ? inKeys + " keys" : n.in.lang}</span></summary><div class="ts-body">${codeView(n.in)}</div></details>
        <details class="ts-section ts-output" open><summary>Output<span class="ts-badge">${outChars} chars · ${outLines} lines</span></summary><div class="ts-body">${codeView(n.out)}</div></details>
        <details class="ts-section ts-meta"><summary>Metadata<span class="ts-badge">${Object.keys(n.extra||{}).length} keys</span></summary><div class="ts-body"><div class="ts-meta-kv">${meta}</div></div></details>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════════
//  Vista CONVERSACIÓN (chat-layout)
// ════════════════════════════════════════════════════════════════════════
// Panel derecho de detalles (nav + chips + métricas + gantt + inv-panel)
function detailsPanel(id) {
    const n = nodeById(id), idx = MOCK.nodes.indexOf(n), cost = costOf(n.tokens);
    const cm = (cls, ic, lab, val) => `<div class="cd-metric ${cls}"><div class="cm-h"><span class="cm-ic">${ic}</span>${lab}</div><div class="cm-n">${val}</div></div>`;
    return `<div class="cd-head"><span class="cd-title"><b class="cd-turn-no">Trace #${MOCK.turn_no}</b><span class="cd-obs-label">${esc(n.label)}: ${esc(n.title)}</span></span></div>
        <div class="cd-body">
            <div class="cd-nav"><button data-nav="prev"${idx === 0 ? " disabled" : ""}>▲ Prev</button><span class="pos">${idx + 1} / ${MOCK.nodes.length}</span><button data-nav="next"${idx === MOCK.nodes.length - 1 ? " disabled" : ""}>Next ▼</button></div>
            <div class="cd-summary-row"><span class="cd-chip">${esc(n.tool || n.label)}</span><span class="cd-chip">Today ${esc(n.clock)}</span><span class="cd-chip"><span class="mono">${esc((n.extra && n.extra.tool_use_id) || n.id)}</span></span></div>
            <div class="cd-metrics">
                ${cm("cost","$","Cost",fmtCost(cost.total))}
                ${cm("in","↓","Input",fmtTok(n.tokens.input || 0))}
                ${cm("out","↑","Output",fmtTok(n.tokens.output || 0))}
                ${cm("cache","⇊","Cache",fmtTok((n.tokens.cacheRead||0)+(n.tokens.cacheWrite||0)))}
                ${cm("dur","◷","Dur",fmtMs(n.durMs))}
            </div>
            <div class="cd-section-title">Spans</div>
            ${ganttHtml(id)}
            <div class="cd-section-title">Tokens &amp; coste</div>
            ${breakdown(n.tokens, false)}
            <div class="cd-section-title">Invocation</div>
            ${invPanel(n)}
        </div>`;
}
function ganttHtml(selId) {
    const rows = MOCK.nodes.map(n => {
        const col = TYPE_COLOR[n.type], left = (n.startMs / totalDur * 100), w = Math.max(2, n.durMs / totalDur * 100);
        return `<div class="gantt-row${n.id === selId ? " selected" : ""}" data-select="${n.id}">
            <span class="gantt-label"><i class="g-dot" style="background:${col}"></i>${esc(n.tool || n.label)}</span>
            <div class="gantt-track"><div class="gantt-bar" style="left:${left}%;width:${w}%;background:${col}"></div></div>
            <span class="gantt-dur">${fmtMs(n.durMs)}</span></div>`;
    }).join("");
    const ticks = [0, .25, .5, .75, 1].map(f => `<span>${(totalDur * f / 1000).toFixed(1)}s</span>`).join("");
    return `<div class="gantt">${rows}<div class="gantt-axis"><span></span><div class="ga-ticks">${ticks}</div><span></span></div></div>`;
}
function invPanel(n) {
    if (S.invMode === "json") {
        const obj = { id: n.id, kind: n.type, title: n.title, tool: n.tool || null, clock: n.clock, startMs: n.startMs, durMs: n.durMs, tokens: n.tokens, cost: Number(costOf(n.tokens).total.toFixed(6)) };
        return `<div class="inv-panel"><div class="inv-panel-head"><span class="ip-ic">✦</span><span class="ip-title">${esc(n.title)}</span>${invToggle()}</div><div class="inv-json">${esc(JSON.stringify(obj, null, 2))}</div></div>`;
    }
    const rows = [
        ["Kind", `<span class="inv-v accent">${esc(n.type)}</span>`],
        ["Title", `<span class="inv-v">${esc(n.title)}</span>`],
        n.tool ? ["Tool", `<span class="inv-v accent">${esc(n.tool)}</span>`] : null,
        ["Session", `<span class="inv-v mono">${esc(MOCK.session.slice(0,18))}…</span>`],
        ["Model", `<span class="inv-v mono">${esc(MOCK.model)}</span>`],
        ["Start", `<span class="inv-v mono">${esc(n.clock)} (+${fmtMs(n.startMs)})</span>`],
        ["Duration", `<span class="inv-v mono">${fmtMs(n.durMs)}</span>`],
    ].filter(Boolean).map(([k, v]) => `<div class="inv-row"><span class="inv-k">${k}</span>${v}</div>`).join("");
    return `<div class="inv-panel"><div class="inv-panel-head"><span class="ip-ic">✦</span><span class="ip-title">${esc(n.title)}</span>${invToggle()}</div>
        <div class="inv-badge">Claude Code · transcript</div><div class="inv-meta">${rows}</div></div>`;
}
const invToggle = () => `<span class="inv-toggle"><button data-inv="ui" class="${S.invMode==="ui"?"active":""}">UI</button><button data-inv="json" class="${S.invMode==="json"?"active":""}">JSON</button></span>`;

// ════════════════════════════════════════════════════════════════════════
//  Vista TIMELINE (waterfall ancho)
// ════════════════════════════════════════════════════════════════════════
function renderTimelineView() {
    const rows = MOCK.nodes.map(n => {
        const col = TYPE_COLOR[n.type], left = n.startMs / totalDur * 100, w = Math.max(4, n.durMs / totalDur * 100);
        return `<div class="tl-row${n.id === S.selected ? " selected" : ""}" data-select="${n.id}">
            <span class="tl-name"><span class="badge ${n.type}">${esc(n.label)}</span><span class="span-title">${esc(n.tool || n.title)}</span></span>
            <div class="tl-track"><div class="tl-bar" style="left:${left}%;width:${w}%;background:${col}">${w >= 8 ? fmtMs(n.durMs) : ""}</div></div>
            <span class="tl-dur">${fmtCost(costOf(n.tokens).total)}</span></div>`;
    }).join("");
    const ticks = [0, .25, .5, .75, 1].map(f => `<span style="font-size:9.5px;color:var(--text-dim)">${(totalDur * f / 1000).toFixed(1)}s</span>`).join("");
    return `<div class="tl-wrap"><div class="cd-section-title">Waterfall de observations · ${fmtMs(totalDur)} total</div>${rows}
        <div class="tl-axis"><span></span><div class="ga-ticks">${ticks}</div><span></span></div></div>`;
}

// ════════════════════════════════════════════════════════════════════════
//  Vista JSON
// ════════════════════════════════════════════════════════════════════════
function renderJsonView() {
    const obj = { session: MOCK.session, project: MOCK.project, trace: MOCK.turn_no, model: MOCK.model, service_tier: MOCK.service_tier,
        started: MOCK.started, prompt: MOCK.prompt, totals: { tokens: TOTALS, cost: Number(costOf(TOTALS).total.toFixed(6)) },
        observations: MOCK.nodes.map(n => ({ id: n.id, kind: n.type, title: n.title, tool: n.tool || null, clock: n.clock, startMs: n.startMs, durMs: n.durMs, tokens: n.tokens, cost: Number(costOf(n.tokens).total.toFixed(6)) })) };
    return `<div class="json-wrap"><div class="inv-panel"><div class="inv-panel-head"><span class="ip-ic">{}</span><span class="ip-title">trace.json</span></div><div class="inv-json">${esc(JSON.stringify(obj, null, 2))}</div></div></div>`;
}

// ════════════════════════════════════════════════════════════════════════
//  Render principal + eventos
// ════════════════════════════════════════════════════════════════════════
function renderView() {
    const root = document.getElementById("view-root");
    if (S.view === "trace") { root.innerHTML = renderMergedView(); bindResizer(); bindSpy(); }
    else if (S.view === "timeline") root.innerHTML = renderTimelineView();
    else root.innerHTML = renderJsonView();
    renderTabs();
}
const updateCd = () => { const cd = document.querySelector(".chat-details"); if (cd) cd.innerHTML = detailsPanel(S.selected); };
// Re-render de la vista Trace conservando el scroll de ambas columnas (evita el salto al inicio).
let spyPaused = false;
function rerenderTrace() {
    spyPaused = true;                                   // evita que el spy pise la selección recién hecha
    const col = document.querySelector(".chat-col"), cd = document.querySelector(".chat-details");
    const ct = col ? col.scrollTop : 0, dt = cd ? cd.scrollTop : 0;
    renderView();
    const c2 = document.querySelector(".chat-col"); if (c2) c2.scrollTop = ct;
    const d2 = document.querySelector(".chat-details"); if (d2) d2.scrollTop = dt;
    setTimeout(() => { spyPaused = false; }, 260);
}
// Scroll-spy: al desplazar la lista, selecciona la observación más alta visible y actualiza el panel.
function bindSpy() {
    const col = document.querySelector(".chat-col");
    if (!col) return;
    let ticking = false;
    col.addEventListener("scroll", () => {
        if (spyPaused || ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
            ticking = false;
            const ref = col.getBoundingClientRect().top + 88;
            let cur = null;
            col.querySelectorAll(".ux-row").forEach(r => { if (r.getBoundingClientRect().top <= ref) cur = r; });
            if (cur && cur.dataset.select !== S.selected) {
                S.selected = cur.dataset.select;
                col.querySelectorAll(".ux-row").forEach(x => x.classList.toggle("selected", x.dataset.select === S.selected));
                col.querySelectorAll(".ux-item").forEach(x => x.classList.toggle("selected", x.querySelector(".ux-row").dataset.select === S.selected));
                const cd = document.querySelector(".chat-details"); if (cd) cd.innerHTML = detailsPanel(S.selected);
            }
        });
    });
}

document.addEventListener("click", (e) => {
    const more = e.target.closest("[data-more]");
    if (more) { e.stopPropagation(); const box = more.parentElement; const exp = box.classList.toggle("expanded"); more.textContent = exp ? "⌃ Ver menos" : more.dataset.more; return; }
    const tab = e.target.closest("[data-view]");
    if (tab) { S.view = tab.dataset.view; renderView(); return; }
    const dens = e.target.closest("[data-density]");
    if (dens) { S.open = dens.dataset.density === "expanded" ? new Set(MOCK.nodes.map(n => n.id)) : new Set(); rerenderTrace(); return; }
    const tog = e.target.closest("[data-toggle]");
    if (tog) { e.stopPropagation(); const id = tog.dataset.toggle; S.open.has(id) ? S.open.delete(id) : S.open.add(id); rerenderTrace(); return; }
    const inv = e.target.closest("[data-inv]");
    if (inv) { S.invMode = inv.dataset.inv; updateCd(); return; }
    const nav = e.target.closest("[data-nav]");
    if (nav) { const i = MOCK.nodes.indexOf(nodeById(S.selected)), j = nav.dataset.nav === "prev" ? i - 1 : i + 1; if (MOCK.nodes[j]) { S.selected = MOCK.nodes[j].id; if (S.view === "trace") { S.open.add(S.selected); rerenderTrace(); } else updateCd(); } return; }
    const bulk = e.target.closest("[data-bulk]");
    if (bulk) { const open = bulk.dataset.bulk === "show"; document.querySelectorAll(".chat-col .ts-section, .chat-col .chat-tool").forEach(d => d.open = open); return; }
    const sel = e.target.closest("[data-select]");
    if (sel) {
        S.selected = sel.dataset.select;
        if (S.view === "trace") { S.open.add(S.selected); rerenderTrace(); }     // expande y muestra contenido + inspector (sin perder scroll)
        else if (S.view === "timeline") renderView();
        else updateCd();
    }
});

// Resizer del panel derecho (conversación)
function bindResizer() {
    const rz = document.getElementById("chat-resizer"), layout = document.getElementById("chat-layout");
    if (!rz) return;
    rz.addEventListener("mousedown", (e) => {
        e.preventDefault(); document.body.classList.add("resizing");
        const startX = e.clientX, startW = S.rightW;
        const move = (ev) => { S.rightW = Math.max(80, Math.min(window.innerWidth - 120, startW - (ev.clientX - startX))); layout.style.setProperty("--chat-right", S.rightW + "px"); };
        const up = () => { document.body.classList.remove("resizing"); window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
        window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    });
}

renderHead();
renderView();
</script>
</body>
</html>
